[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/sync",
    "crates/provider-local",
    "crates/provider-feedly",
    "crates/reader",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"  # tatsächlich geprüft mit 1.98; Lockfile verlangt stabile 2024-Edition
license = "MIT OR Apache-2.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
sync-engine = { path = "crates/sync" }
provider-local = { path = "crates/provider-local" }
provider-feedly = { path = "crates/provider-feedly" }
reader = { path = "crates/reader" }

glib = { version = "0.22", features = ["v2_80"] }
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
webkit6 = "0.6"

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
feed-rs = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json"] }
url = "2"
ammonia = "4.2"
scraper = "0.27"
quick-xml = "0.42"
html5ever = "0.35"
markup5ever_rcdom = "0.35"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
