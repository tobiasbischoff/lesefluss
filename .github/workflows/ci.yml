name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test und Clippy (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      # GTK4, libadwaita, WebKitGTK 6 und die Header der Systembibliotheken werden
      # von pkg-config zur Übersetzungszeit gebraucht; ohne sie kann cargo nicht bauen.
      - name: Abhängigkeiten
        run: |
          pacman -Syu --noconfirm --needed git
          pacman -S --noconfirm --needed \
            gtk4 libadwaita webkitgtk-6.0 \
            glib2-devel pango cairo gdk-pixbuf2 atk at-spi2-atk \
            libx11 libxext libxrender libxi libxcursor libxdamage libxfixes libxrandr \
            wayland wayland-protocols libxkbcommon \
            sqlite libsecret openssl
          sed -i 's/^#\?\(MAKEFLAGS\).*/\1="-j$(nproc)"/' /etc/makepkg.conf
      - name: Werkzeugketten prüfen
        run: |
          pkg-config --exists gtk4 && echo "gtk4 ok"
          pkg-config --exists libadwaita-1 && echo "libadwaita ok"
          # Das Paket webkitgtk-6.0 liefert genau diese .pc-Datei.
          pkg-config --exists webkitgtk-6.0 && echo "webkitgtk-6.0 ok"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Bauen
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy (streng)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Formatierung
        run: cargo fmt --all -- --check
      # makepkg darf nicht als root laufen: eigener Benutzer, eigener Cache.
      # Die rustup-Toolchain oben liegt in roots Home und ist für den
      # Bau-Benutzer nicht nutzbar; er baut mit dem `rust`-Paket (makedepends).
      # makepkg kennt kein `--logdir`, das Protokollziel ist `LOGDEST`.
      - name: Installationspaket
        run: |
          pacman -S --noconfirm --needed rust
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c '
            export PATH=/usr/bin:$PATH
            export CARGO_HOME=$HOME/.cargo
            export XDG_CACHE_HOME=$HOME/.cache
            export LOGDEST=$HOME/makepkg-logs
            mkdir -p "$XDG_CACHE_HOME" "$LOGDEST"
            cd packaging
            makepkg -f --noconfirm --nodeps
            ls -l ./*.pkg.tar.zst
          '
